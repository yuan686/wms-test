spring:
  application:
    name: wms-backend

  data:
    redis:
      host: localhost
      port: 6379
      password:

  # H2 内存数据库（开发环境）
  # datasource:
  #   url: jdbc:h2:mem:wms;DB_CLOSE_DELAY=-1;MODE=MySQL
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:

  # 如需切换到 MySQL，注释上面，取消注释下面：
  datasource:
    url: jdbc:mysql://localhost:3306/wms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# 出库申请缓存防护配置
wms:
  outbound:
    cache:
      stock-base-ttl-seconds: 1800
      stock-ttl-jitter-seconds: 600
      null-base-ttl-seconds: 120
      null-ttl-jitter-seconds: 60
      meta-base-ttl-seconds: 3600
      meta-ttl-jitter-seconds: 900
      lock-wait-millis: 3000
      lock-lease-seconds: 10
      lock-poll-millis: 50

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
